name: App Store

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'memory/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version override (default: read from Info.plist)"
        required: false
      build_number:
        description: "Build number override (default: github.run_number)"
        required: false

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# Stage 1 — Build
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build:
    name: "Stage 1 — Build"
    runs-on: macos-14
    outputs:
      version: ${{ steps.set-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d /Applications/Xcode_16.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version

      - name: Cache SPM
        uses: actions/cache@v5
        with:
          path: .build
          key: spm-${{ runner.os }}-xcode162-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-xcode162-

      - name: Set version and build number
        id: set-version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          BUILD="${{ github.event.inputs.build_number }}"

          if [ -z "$VERSION" ]; then
            VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Memo.app/Contents/Info.plist)
          fi
          if [ -z "$BUILD" ]; then
            BUILD="${{ github.run_number }}"
          fi

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $VERSION" \
            Memo.app/Contents/Info.plist
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion $BUILD" \
            Memo.app/Contents/Info.plist

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "→ Version: $VERSION (build $BUILD)"

      - name: Inject Xcode build metadata into Info.plist
        run: |
          PLIST="Memo.app/Contents/Info.plist"
          XCODE_VERSION=$(xcodebuild -version | head -1 | awk '{print $2}')
          XCODE_BUILD=$(xcodebuild -version | tail -1 | awk '{print $3}')
          SDK_VERSION=$(xcrun --show-sdk-version --sdk macosx)
          SDK_NAME="macosx${SDK_VERSION}"
          SDK_BUILD=$(xcrun --show-sdk-build-version --sdk macosx)
          OS_BUILD=$(sw_vers -buildVersion)

          for key in CFBundleSupportedPlatforms DTPlatformName DTPlatformVersion \
                     DTSDKName DTSDKBuild DTXcode DTXcodeBuild DTCompiler BuildMachineOSBuild; do
            /usr/libexec/PlistBuddy -c "Delete :$key" "$PLIST" 2>/dev/null || true
          done

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleSupportedPlatforms array" \
            -c "Add :CFBundleSupportedPlatforms:0 string MacOSX" \
            -c "Add :DTPlatformName string macosx" \
            -c "Add :DTPlatformVersion string $SDK_VERSION" \
            -c "Add :DTSDKName string $SDK_NAME" \
            -c "Add :DTSDKBuild string $SDK_BUILD" \
            -c "Add :DTXcode string ${XCODE_VERSION//./}" \
            -c "Add :DTXcodeBuild string $XCODE_BUILD" \
            -c "Add :DTCompiler string com.apple.compilers.llvm.clang.1_0" \
            -c "Add :BuildMachineOSBuild string $OS_BUILD" \
            "$PLIST"

          echo "→ Injected Xcode build metadata:"
          echo "  Xcode: $XCODE_VERSION ($XCODE_BUILD)"
          echo "  SDK: $SDK_NAME ($SDK_BUILD)"
          echo "  Platform: MacOSX"

      - name: Build release
        run: swift build -c release

      - name: Package app bundle
        run: bash scripts/package-app.sh

      - name: Validate app bundle
        run: bash scripts/validate-bundle.sh

      - name: Tar app bundle (preserves permissions + bundle structure)
        run: tar -czf Memo.app.tar.gz Memo.app

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Memo-app
          path: Memo.app.tar.gz
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# Stage 2 — Sign & Package
# ─────────────────────────────────────────────────────────────────────────────
  sign-and-package:
    name: "Stage 2 — Sign & Package"
    needs: build
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Import signing certificates
        env:
          APP_CERT_P12: ${{ secrets.APP_STORE_CERT_P12 }}
          APP_CERT_PASSWORD: ${{ secrets.APP_STORE_CERT_PASSWORD }}
          INSTALLER_CERT_P12: ${{ secrets.APP_STORE_INSTALLER_CERT_P12 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.APP_STORE_INSTALLER_CERT_PASSWORD }}
        run: |
          APP_CERT_PATH="$RUNNER_TEMP/appstore-app.p12"
          INSTALLER_CERT_PATH="$RUNNER_TEMP/appstore-installer.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/appstore.keychain-db"

          echo "$APP_CERT_P12" | base64 --decode > "$APP_CERT_PATH"
          echo "$INSTALLER_CERT_P12" | base64 --decode > "$INSTALLER_CERT_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"

          security import "$APP_CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APP_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild \
            -T /usr/bin/productsign \
            -f pkcs12

          security import "$INSTALLER_CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$INSTALLER_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild \
            -T /usr/bin/productsign \
            -f pkcs12

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign:,productbuild: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"' | xargs)
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "→ All identities in keychain:"
          security find-identity -v "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -1 | awk -F'"' '{print $2}')
          echo "→ App signing identity: $SIGNING_IDENTITY"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::No app signing identity found. Check APP_STORE_CERT_P12."
            exit 1
          fi

          INSTALLER_SIGNING_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" | grep -iE "installer|3rd Party Mac Developer" | head -1 | awk -F'"' '{print $2}')
          echo "→ Installer signing identity: $INSTALLER_SIGNING_IDENTITY"
          echo "INSTALLER_SIGNING_IDENTITY=$INSTALLER_SIGNING_IDENTITY" >> "$GITHUB_ENV"

          if [ -z "$INSTALLER_SIGNING_IDENTITY" ]; then
            echo "::error::No installer signing identity found. Check APP_STORE_INSTALLER_CERT_P12."
            security find-identity -v "$KEYCHAIN_PATH"
            exit 1
          fi

      - name: Download app bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: Memo-app

      - name: Extract app bundle (restores permissions + bundle structure)
        run: |
          tar -xzf Memo.app.tar.gz
          rm Memo.app.tar.gz
          echo "→ Binary permissions after extraction:"
          ls -la Memo.app/Contents/MacOS/Memo

      - name: Embed provisioning profile
        env:
          PROFILE: ${{ secrets.APP_STORE_PROVISIONING_PROFILE }}
        run: |
          echo "$PROFILE" | base64 --decode > Memo.app/Contents/embedded.provisionprofile
          echo "→ Provisioning profile embedded"

      - name: Strip extended attributes
        run: |
          xattr -cr Memo.app
          echo "→ Quarantine and other xattrs removed"

      - name: Sign app with Apple Distribution certificate (inside-out)
        run: |
          security unlock-keychain -p "" "$RUNNER_TEMP/appstore.keychain-db"
          KEYCHAIN="$RUNNER_TEMP/appstore.keychain-db"

          echo "→ Signing resource bundle (no entitlements)"
          codesign --force --options runtime \
            --sign "$SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN" \
            Memo.app/Contents/Resources/Memo_Memo.bundle

          echo "→ Signing main app bundle (with entitlements)"
          codesign --force --options runtime \
            --sign "$SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN" \
            --entitlements Memo.entitlements \
            Memo.app

          echo "→ Verifying signature"
          codesign --verify --deep --strict --verbose=2 Memo.app

      - name: Create installer package
        timeout-minutes: 5
        run: |
          security unlock-keychain -p "" "$RUNNER_TEMP/appstore.keychain-db"
          bash scripts/package-pkg.sh \
            "${{ needs.build.outputs.version }}" \
            "$INSTALLER_SIGNING_IDENTITY" \
            "$RUNNER_TEMP/appstore.keychain-db"

      - name: Upload installer package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Memo-pkg
          path: Memo-v${{ needs.build.outputs.version }}.pkg
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# Stage 3 — Upload to TestFlight
# ─────────────────────────────────────────────────────────────────────────────
  upload:
    name: "Stage 3 — Upload to TestFlight"
    needs: [build, sign-and-package]
    runs-on: macos-14

    steps:
      - name: Download installer package artifact
        uses: actions/download-artifact@v8
        with:
          name: Memo-pkg

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          mkdir -p ~/.private_keys
          echo "$ASC_KEY_P8" > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8

          VERSION="${{ needs.build.outputs.version }}"
          echo "→ Uploading Memo-v${VERSION}.pkg to App Store Connect"

          xcrun altool --upload-app \
            --file "Memo-v${VERSION}.pkg" \
            --type macos \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose
